<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Extractor for Telegram Web</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Lead Extractor for Telegram Web</h1>
        <p class="app__subtitle">Export member info from the currently open group or channel.</p>
      </header>

      <section class="status" aria-live="polite">
        <span id="statusDot" class="status__dot status__dot--unknown"></span>
        <span id="statusText" class="status__text">Checking Telegram Web…</span>
      </section>

      <section class="card" aria-label="Group information">
        <div class="card__label">Group / Channel</div>
        <div id="groupName" class="group-name">—</div>
        <div class="card__label card__label--spaced">Members found</div>
        <div id="count" class="count">0</div>
      </section>

      <section id="progress" class="progress" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <div id="progressText" class="progress__text">Extracting members…</div>
      </section>

      <section id="message" class="message" hidden></section>

      <section class="controls">
        <button id="extractBtn" class="btn btn--primary" aria-label="Start extracting members">
          Extract Members
        </button>
        <button id="stopBtn" class="btn btn--ghost" aria-label="Stop extraction" hidden>
          Stop
        </button>

        <div class="controls__row">
          <button id="csvBtn" class="btn btn--secondary" aria-label="Download as CSV" disabled>
            Download CSV
          </button>
          <button id="excelBtn" class="btn btn--secondary" aria-label="Download as Excel" disabled>
            Download Excel
          </button>
        </div>
        <div class="controls__row">
          <button id="jsonBtn" class="btn btn--secondary" aria-label="Download as JSON" disabled>
            Download JSON
          </button>
          <button id="clearBtn" class="btn btn--secondary" aria-label="Clear results" disabled>
            Clear
          </button>
        </div>
      </section>

      <footer class="app__footer">
        <span>Data stays in your browser. Nothing is uploaded.</span>
        <a id="optionsLink" href="#" class="app__link">Settings</a>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
